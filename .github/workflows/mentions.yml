name: Mentions poll
# Every 15 minutes: answer unanswered @-summons with the canonical line.
# Idempotent, bounded pagination, and rate-limited in bot.py (1/thread, 30/day).
# SPEC-ticker-bot.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Only one mentions run at a time; a fresh run supersedes a stale/stuck one.
# Safe because the job is idempotent and re-scans the notification window, so a
# cancelled run loses no summons.
concurrency:
  group: mentions-poll
  cancel-in-progress: true

jobs:
  mentions:
    runs-on: ubuntu-latest
    # Fail fast instead of hanging (e.g. a run that never acquires a hosted
    # runner) — a stuck run frees its slot in 5 min rather than 6 hours.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python bot.py mentions
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
