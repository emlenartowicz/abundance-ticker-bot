name: Discover & follow
# Daily off-peak: witness-follow on-topic accounts (max 10/day, ceiling 500).
# Appends follows.log and commits it back. SPEC-ticker-bot.
on:
  schedule:
    - cron: "43 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python bot.py discover
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
      - name: Commit follow log if changed
        run: |
          if ! git diff --quiet -- follows.log; then
            git config user.name "abundance-ticker-bot"
            git config user.email "actions@users.noreply.github.com"
            git add follows.log
            git commit -m "Witness follows $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No new follows to commit."
          fi
