name: Annual reality check
# Mid-September yearly (data season): the public annual data-day post +
# a private "is the page still telling the truth?" issue. SPEC-zero-hour.
on:
  schedule:
    - cron: "0 12 15 9 *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  reality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python bot.py reality-check
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
